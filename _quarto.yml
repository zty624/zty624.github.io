    theme: [flatly, darkly]
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/zty624\.github\.io\/custom'
    include-in-header: "files/includes/_academic.qmd"

